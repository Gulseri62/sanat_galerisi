<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Satın Al</title>
</head>
<body>
    <h2>{{ artwork.title }} - Satın Al</h2>
    <p>Fiyat: {{ artwork.price }} TL</p>
    <form method="POST">
        {% csrf_token %}
        <label>Ödeme Yöntemi:</label>
        <select name="method">
            <option value="credit_card">Kredi Kartı</option>
            <option value="debit_card">Banka Kartı</option>
            <option value="bank_transfer">Havale</option>
        </select><br><br>
        <button type="submit">Satın Al</button>
    </form>
</body>
</html>
